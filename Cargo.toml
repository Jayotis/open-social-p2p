[workspace]
resolver = "3"
members = ["crates/osp-proto", "crates/osp-node", "crates/osp-cli", "crates/osp-client", "crates/osp-sim", "crates/osp-tor", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE"
repository = "https://github.com/Jayotis/open-social-p2p"

[workspace.dependencies]
osp-proto = { path = "crates/osp-proto" }
osp-node = { path = "crates/osp-node" }
osp-client = { path = "crates/osp-client" }
osp-tor = { path = "crates/osp-tor" }

anyhow = "1"
bip39 = { version = "3", default-features = false, features = ["zeroize"] } # English words only
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
data-encoding = "2.11"
directories = "6"
getrandom = "0.4"
humantime = "2.4"
iroh = { version = "1.4", features = ["unstable-net-report"] } # NAT behaviour for `status`; outside semver, so a bump may need code changes
iroh-base = { version = "1.4", features = ["key"] }
iroh-blobs = "0.104.0" # minimum: earlier versions ignored EventMask modes (ADR 0002)
iroh-relay = "1.4" # tests only: a relay server on loopback
n0-future = "0.3"
n0-watcher = "1" # iroh's custom transports need it: osp-tor, and osp-node's simulated network (`sim`)
noq-udp = { version = "1.4", default-features = false } # the same
postcard = { version = "1", default-features = false, features = ["use-std"] }
qr2term = "0.3"
ring = "0.17" # already used by iroh; encrypts backup files (ADR 0009)
rusqlite = { version = "0.41", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = { version = "0.12", default-features = false } # onion addresses' checksum (osp-tor)
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
