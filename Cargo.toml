[workspace]
resolver = "3"
members = ["crates/osp-proto", "crates/osp-node", "crates/osp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE"
repository = "https://github.com/Jayotis/open-social-p2p"

[workspace.dependencies]
osp-proto = { path = "crates/osp-proto" }
osp-node = { path = "crates/osp-node" }

anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
data-encoding = "2.11"
directories = "6"
humantime = "2.4"
iroh = { version = "1.4", features = ["unstable-net-report"] } # NAT behaviour for `status`; outside semver, so a bump may need code changes
iroh-base = { version = "1.4", features = ["key"] }
iroh-blobs = "0.103.1" # minimum: earlier versions ignored EventMask modes (ADR 0002)
n0-future = "0.3"
qr2term = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
