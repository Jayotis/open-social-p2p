[package]
name = "osp-carrier"
description = "Open Social P2P's carrier circuits (ADR 0043): descriptors, frames and the layer each hop adds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1"
# The same version hpke uses, so there's one ChaCha20-Poly1305 in the build.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom.workspace = true
# Pinned and reviewed when building started (ADR 0043's design note): RFC 9180,
# checked against its test vectors. One suite only.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
iroh.workspace = true
iroh-base.workspace = true
n0-future.workspace = true
postcard.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
