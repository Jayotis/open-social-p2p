[package]
name = "osp-node"
description = "Open Social P2P home node: storage, media pipeline, social sync and content distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# `Node::spawn_sim` and the simulated network, for the harness (`osp-sim`)
# and tests only. Nothing in `config.toml` or the CLI reaches it.
sim = ["iroh/unstable-custom-transports", "dep:iroh-base", "dep:n0-watcher", "dep:noq-udp"]

[dependencies]
osp-proto.workspace = true
anyhow.workspace = true
bip39.workspace = true
blake3.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
humantime.workspace = true
iroh.workspace = true
iroh-base = { workspace = true, optional = true }
iroh-blobs.workspace = true
n0-future.workspace = true
n0-watcher = { workspace = true, optional = true }
noq-udp = { workspace = true, optional = true }
ring.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# The tests use `Node::spawn_sim` to shorten waits.
osp-node = { path = ".", features = ["sim"] }
iroh-relay = { workspace = true, features = ["server"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
