[package]
name = "osp-node"
description = "Open Social P2P home node: storage, media pipeline, social sync and content distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# `Node::spawn_sim`, for the simulated network harness (`osp-sim`) only.
# Nothing in `config.toml` or the CLI reaches it.
sim = []

[dependencies]
osp-proto.workspace = true
anyhow.workspace = true
bip39.workspace = true
blake3.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
humantime.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
n0-future.workspace = true
ring.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
iroh-relay = { workspace = true, features = ["server"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
