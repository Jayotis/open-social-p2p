# Monthly dependency update pull requests, grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # From 0.2.190, libc defines in6_ifreq for macOS only, and netdev 0.46
      # (under iroh's netwatch) uses it on iOS too: the iPhone build fails.
      # Drop this once netdev or libc is fixed (CI's ios job checks it).
      - dependency-name: libc
        versions: [">= 0.2.190"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
