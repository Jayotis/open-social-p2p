name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only access to the repository is all these jobs need.
permissions:
  contents: read

# A new push to a pull request stops the run it replaces. Runs on main each
# get a group of their own, so none is stopped.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Which of the slow jobs a change needs, so a change to the docs alone
    # runs only the quick checks. A path not named below counts as Rust, and a
    # change under .github runs everything.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      flutter: ${{ steps.paths.outputs.flutter }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            # Nothing to compare with, such as a new branch: run everything.
            files=.github/
          fi
          printf '%s\n' "$files"
          all=false
          grep -Eq '^\.github/' <<< "$files" && all=true
          # What can't change what Rust builds or tests.
          not_rust='^(docs/|notes/|app/(lib|test|android|ios|icon|assets)/|app/[^/]+$|[^/]+\.md$|LICENSE$|codemagic\.yaml$|\.gitignore$|\.gitleaks\.toml$)'
          rust=$all
          grep -Evq "$not_rust" <<< "$files" && rust=true
          # The app's Dart, not the Rust under app/rust (the rust job's).
          flutter=$all
          awk '/^app\// && !/^app\/rust\// { f = 1 } END { exit !f }' <<< "$files" && flutter=true
          # The iPhone check is of dependencies only.
          ios=$all
          grep -Eq '^(Cargo\.(toml|lock)|rust-toolchain)' <<< "$files" && ios=true
          echo "rust=$rust flutter=$flutter ios=$ios"
          { echo "rust=$rust"; echo "flutter=$flutter"; echo "ios=$ios"; } >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The media tools' packages are kept between runs, so a slow package
      # mirror only matters when the runner image moves to newer versions.
      - name: Name the runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: media-debs-${{ steps.image.outputs.version }}
          # Before libheif, the cache held ffmpeg's packages alone.
          restore-keys: |
            media-debs-
            ffmpeg-debs-
      - name: Install ffmpeg and libheif
        # Package mirrors sometimes hang; fail fast rather than wait for the job limit.
        timeout-minutes: 5
        run: |
          mkdir -p ~/apt-archives/partial
          opts="-o Acquire::Retries=3 -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get update -o Acquire::Retries=3
          # libheif's HEVC decoder is only recommended, so it's named here.
          sudo apt-get install -y --no-install-recommends $opts ffmpeg \
            libheif-examples libheif-plugin-libde265
          # Drop versions that were replaced, and apt's own files the cache can't read.
          sudo apt-get autoclean $opts
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  flutter:
    # The Android app's Dart code. The Rust it calls is built and tested by
    # the rust job (app/rust is a workspace member). No APK is built here.
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  ios:
    # The iPhone app's Rust, as far as Linux can check it: the network crates
    # that broke on iOS before (libc 0.2.190 left out a type netdev uses).
    # Crates with C build scripts, such as ring, need Apple's compiler, so the
    # whole app is only built on Codemagic (codemagic.yaml).
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo check --target aarch64-apple-ios -p netwatch -p portmapper

  audit:
    # Fails if any dependency has a known security vulnerability (RustSec
    # database). "Unmaintained" notices are reported but don't fail the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  secrets:
    # Fails if a secret was ever committed (rules in .gitleaks.toml). The
    # history scan skips binary files, so the checked-out files are scanned
    # too; that catches a keystore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - run: $RUNNER_TEMP/gitleaks git --no-banner --redact --config .gitleaks.toml .
      - run: $RUNNER_TEMP/gitleaks dir --no-banner --redact --config .gitleaks.toml .
